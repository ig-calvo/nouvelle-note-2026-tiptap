     tant que l'URL ne change pas (même après un rechargement complet de la page). -->

<style>
  /* DS3 token bridge — needed by editor components. Chaque alias historique
     pointe sur le rôle DS3 correspondant (ds3-tokens.css), donc suit le mode
     clair / sombre sans que les composants n'en aient conscience. */
  :root {
    --brand-primary: var(--mat-sys-primary);
    --brand-primary-hover: light-dark(rgb(41, 52, 166), #cfd2ee);
    --brand-primary-container: var(--mat-sys-primary-container);

    --fg-1: var(--mat-sys-on-surface);
    --fg-2: var(--mat-sys-on-surface);
    --fg-3: var(--mat-sys-on-surface-variant);
    --fg-4: light-dark(rgb(107,107,107), #adabba);
    --bg-alt: var(--mat-sys-surface-container-low);
    --bg-subtle: var(--mat-sys-surface-container);

  html, body { margin: 0; padding: 0; background: var(--mat-sys-surface); color: var(--mat-sys-on-surface); font-family: 'Inter', sans-serif; height: 100%; }
  * { box-sizing: border-box; }
  #root { height: 100vh; overflow: auto; }
  .app { display: flex; flex-direction: column; height: 100vh; min-width: 1180px; background: var(--mat-sys-surface); overflow: hidden; }
  .main-row { display: flex; flex: 1; min-height: 0; }
  .content {
    flex: 1;
    padding: 16px 16px 0 16px;
    display: flex;
    flex-direction: row;
    gap: 16px;
    min-width: 0;
    overflow: hidden;
    background: var(--mat-sys-surface);
    align-items: stretch;
  }
  /* Colonne centrale : bannière patient épinglée + zone défilante.
     La bannière vit HORS du conteneur scrollable pour éviter le bug de
     compositing (sticky + z-index dans overflow:auto passe au-dessus des
     scrims fixes). Hors-scroll, un z-index normal suffit : au-dessus du
     contenu, sous les scrims. */
  .center-wrap {
    flex: 1;
    min-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .center-col {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    padding-right: 8px;
  }
  /* Note expansion animation */
  @keyframes ftbar-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ai-blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0.25; }
  }
  @keyframes ai-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes note-expand {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .note-expand {
    animation: note-expand 300ms ease-in-out;
  }
  /* Patient banner collapse animation */
  @keyframes banner-collapse-in {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .banner-collapse {
    animation: banner-collapse-in 300ms ease-in-out;
  }
  .note-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: var(--mat-sys-surface-container-lowest);
    border-top: 1px solid var(--mat-sys-outline-variant);
    /* Pas de z-index : sticky crée déjà son propre contexte d'empilement et,
       étant le dernier enfant, il couvre le contenu qui défile dessous. Un
       z-index positif le ferait passer au-dessus des scrims modaux (piégés
       dans l'aside Summary en position:sticky). */
    min-height: 64px;
    margin-top: auto;
    box-shadow: var(--ds-level2-up); /* élément flottant : élévation ≥ 2 */

<!-- Langue (PLAN-bilingue-fr-en.md) : i18n.js choisit la langue (?lang=fr|en,
     mémorisée), fixe <html lang> et publie t / tn / L. Le français est toujours
     chargé (c'est le repli de tout texte sans traduction) ; l'anglais seulement
     s'il est demandé, et son absence est silencieuse (repli sur le français).
     document.write dans des blocs classiques, pendant le parsing : même règle
     que le chargeur JSX plus bas (un bloc qui lirait I18N doit suivre celui qui
     l'écrit, jamais l'inverse). -->
<script>
(function () {
  var bust = '?v=' + Date.now();
  document.write('<script src="note-ui/i18n.js' + bust + '"><\/script>');
  document.write('<script src="note-ui/i18n/fr.js' + bust + '"><\/script>');
})();
</script>
<script>
(function () {
  if (window.I18N.lang !== 'en') return;
  var bust = '?v=' + Date.now();
  var absent = 'onerror="(window.I18N.absent = window.I18N.absent || []).push(this.getAttribute(\'src\'))"';
  document.write('<script src="note-ui/i18n/en.js' + bust + '" ' + absent + '><\/script>');
  document.write('<script src="note-ui/i18n/data-en.js' + bust + '" ' + absent + '><\/script>');
})();
</script>

<!-- Tiptap (exploration — remplace Quill). Import dynamique (au lieu d'un
     `import` statique) pour pouvoir intercepter un échec réseau — un CDN
     injoignable (esm.sh) faisait autrement planter silencieusement tout le
     reste du chargement (page blanche, sans message). Version épinglée sur
     tous les paquets @tiptap/* pour éviter une double instance de
     prosemirror-model. -->
<script type="module">
  (async function () {
    try {
      const [core, pmState, pmView, starterKit, placeholder, suggestion, underline, textStyle, color, highlight, link] = await Promise.all([
        import('https://esm.sh/@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/pm@2.11.5/state'),
        import('https://esm.sh/@tiptap/pm@2.11.5/view'),
        import('https://esm.sh/@tiptap/starter-kit@2.11.5'),
        import('https://esm.sh/@tiptap/extension-placeholder@2.11.5'),
        import('https://esm.sh/@tiptap/suggestion@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/pm@2.11.5'),
        import('https://esm.sh/@tiptap/extension-underline@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-text-style@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-color@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/extension-text-style@2.11.5'),
        import('https://esm.sh/@tiptap/extension-highlight@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-link@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/pm@2.11.5'),
      ]);
      window.Tiptap = {
        Editor: core.Editor, Node: core.Node, Mark: core.Mark, Extension: core.Extension, mergeAttributes: core.mergeAttributes,
        StarterKit: starterKit.default, Placeholder: placeholder.default, Suggestion: suggestion.default,
        Underline: underline.default, TextStyle: textStyle.default, Color: color.default, Highlight: highlight.default,
        Link: link.default,
        // Decoration/DecorationSet (numérotation des diagnostics par
        // décorations, editor-schema.jsx) DOIVENT venir de la même instance
        // de prosemirror-view que celle utilisée par l'EditorView réel —
        // même version épinglée (2.11.5) que /state ci-dessus, déjà
        // éprouvée : Plugin/PluginKey en sont issus et fonctionnent avec
        // core sans problème d'instance depuis le début de ce prototype.
        pm: { Plugin: pmState.Plugin, PluginKey: pmState.PluginKey, TextSelection: pmState.TextSelection,
          Decoration: pmView.Decoration, DecorationSet: pmView.DecorationSet, EditorView: pmView.EditorView }
      };
      window.dispatchEvent(new Event('tiptap:ready'));
    } catch (err) {
      window.dispatchEvent(new CustomEvent('tiptap:error', { detail: { message: (err && err.message) || String(err) } }));
    }
  })();
</script>

<script>
(function () {
  // Deux fichiers indépendants : la liste plate existante (CIM10_DATA) et la
  // hiérarchie (chapitres/blocs/catégories manquantes — CIM10_HIERARCHY, voir
  // note-ui/cim10-index.jsx). Chargés séparément, chacun posé sur `window` dès
  // qu'il arrive : un échec de la hiérarchie n'empêche pas CIM10_DATA d'être
  // utilisable par l'ancien /dx (searchCIM10), qui ne lit que ce fichier.
  var v = '?v=' + Date.now();
  // Chaque fetch attrape sa propre erreur (jamais de rejet qui remonte) —
  // Promise.all attend donc toujours les DEUX tentatives, réussies ou non,
  // avant d'émettre cim10:ready une seule fois. Sans ça, l'ordre d'arrivée
  // réseau des deux fichiers pourrait déclencher l'événement avant que
  // CIM10_DATA (le plus gros des deux) soit posé.
  // Fichiers selon la langue (PLAN-bilingue-fr-en.md, lot A5). Le fichier de la
  // langue d'affichage passe en premier ; l'autre langue est chargée aussi, pour
  // que la recherche trouve un diagnostic avec un terme français comme avec un
  // terme anglais. Si le fichier de la langue ne charge pas, on retombe sur le
  // français : le /dx ne se bloque jamais.
  var lang = (window.I18N && window.I18N.lang) || 'fr';
  var other = lang === 'en' ? 'fr' : 'en';
  var CIM10_FILES = {
    fr: { rows: 'note-ui/cim10-fr-clinique.json', hier: 'note-ui/cim10-hierarchy.json' },
    en: { rows: 'note-ui/cim10-en-clinique.json', hier: 'note-ui/cim10-hierarchy-en.json' }
  };
  var SNOMED_FILES = { fr: 'note-ui/snomed-diagnostics-fr.json', en: 'note-ui/snomed-diagnostics.json' };
  // Essaie les adresses dans l'ordre ; rejette seulement si aucune ne répond.
  function fetchFirst(urls) {
    return urls.reduce(function (before, url) {
      return before.catch(function () {
        return fetch(url + v).then(function (r) {
          if (!r.ok) throw new Error(url + ' : HTTP ' + r.status);
          return r.json();
        });
      });
    }, Promise.reject(new Error('aucune adresse')));
  }
  // Chaque chargement attrape sa propre erreur (jamais de rejet qui remonte),
  // donc Promise.all attend toujours toutes les tentatives avant l'événement.
  // `required` : une erreur est affichée par CIM10.status() / SNOMED.ready().
  function get(urls, onOk, required) {
    return fetchFirst(urls).then(onOk).catch(function (err) {
      var msg = (err && err.message) || String(err);
      if (required) window.CIM10_ERROR = msg;
      console.error('Diagnostics : ' + msg + (required ? '' : ' (langue secondaire, ignorée)'));
    });
  }
  var own = CIM10_FILES[lang], fr = CIM10_FILES.fr, alt = CIM10_FILES[other];
  Promise.all([
    get([own.rows, fr.rows], function (d) { window.CIM10_DATA = d; }, true),
    get([own.hier, fr.hier], function (d) { window.CIM10_HIERARCHY = d; }, true),
    get([alt.rows], function (d) { window.CIM10_DATA_ALT = d; }, false),
    get([alt.hier], function (d) { window.CIM10_HIERARCHY_ALT = d; }, false)
  ]).then(function () {
    // Émis même si un fichier a échoué : CIM10.status() distingue
    // 'ready'/'error' via window.CIM10_ERROR — voir cim10-index.jsx. Une
    // hiérarchie manquante n'empêche pas l'ancien /dx (searchCIM10, qui ne
    // lit que CIM10_DATA) de continuer à fonctionner.
    window.dispatchEvent(new Event('cim10:ready'));
  });
  // Dictionnaire SNOMED CT (note-ui/snomed-index.jsx) : source de suggestions
  // en plus de la CIM-10 — un échec ne bloque rien (SNOMED.ready() reste faux).
  // Le fichier français porte aussi le terme anglais ; en anglais, il ne sert
  // qu'à la recherche par terme français.
  var snomedLoads = [get([SNOMED_FILES[lang], SNOMED_FILES.en], function (d) { window.SNOMED_DATA = d; }, true)];
  if (lang === 'en') snomedLoads.push(get([SNOMED_FILES.fr], function (d) { window.SNOMED_ALT = d; }, false));
  Promise.all(snomedLoads).then(function () { window.dispatchEvent(new Event('snomed:ready')); });
})();
</script>
<!-- Chargeur JSX avec anti-cache : ajoute un horodatage à chaque rechargement
     pour qu'on voie toujours la dernière version du code pendant le prototypage.
     TOUJOURS synchrone et inconditionnel : document.write() appelé après la
     fin du parsing (ex. depuis un callback asynchrone comme un event listener
     ou une Promise résolue) déclenche un document.open() implicite qui EFFACE
     toute la page (dont #root) — une version antérieure attendait l'événement
     tiptap:ready avant d'appeler document.write ici, ce qui cassait le
     chargement de façon intermittente. Ne plus reproduire ce piège : ce
     chargeur doit rester un bloc <script> classique exécuté pendant le
     parsing initial, sans dépendance asynchrone. -->
<script>
(function () {

    'note-ui/note-sections.jsx',
    'note-ui/diagnostics.jsx',
    'note-ui/cim10-index.jsx',
    'note-ui/snomed-index.jsx',
    'note-ui/dx-picker.jsx',
    'note-ui/editor-schema.jsx',
    'note-ui/review-mode.jsx',
    'note-ui/DocumentViewerModal.jsx',
    'note-ui/editor-field.jsx',

    'note-ui/TransmissionModal.jsx',
    'note-ui/QuickSendModal.jsx',
    'note-ui/rich-text-controls.jsx',
    'note-ui/ActionLog.jsx',
    'note-ui/SuggestionsColumn.jsx',
    'note-ui/NoteEditor.jsx',
    'note-ui/NoteStartCards.jsx',
    'note-ui/SmartNoteModal.jsx',

  var bust = '?v=' + Date.now();

<!-- Message diagnostic si Tiptap échoue à charger (CDN injoignable/bloqué) —
     posé via les API DOM normales (createElement/appendChild), jamais
     document.write, justement pour rester sans risque même déclenché de
     façon asynchrone par l'événement tiptap:error ci-dessus. -->
<script>
(function () {
  function showBanner(message) {
    var div = document.createElement('div');
    div.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--mat-sys-surface-container-lowest);display:flex;align-items:center;justify-content:center;padding:32px;font-family:sans-serif;text-align:center;';
    div.innerHTML =
      '<div style="max-width:480px;"><h2 style="color:light-dark(#b3261e, #e9a9a5);margin-bottom:8px;">' + t('app.tiptap.title') + '</h2>' +
      '<p style="color:var(--mat-sys-on-surface);margin-bottom:6px;">' + String(message).replace(/</g, '&lt;') + '</p>' +
      '<p style="color:var(--mat-sys-on-surface-variant);font-size:13px;">' + t('app.tiptap.hint') + '</p></div>';
    (document.body || document.documentElement).appendChild(div);
  }
  window.addEventListener('tiptap:error', function (e) {
    showBanner((e.detail && e.detail.message) || t('app.tiptap.text'));
  });
})();
</script>

<script type="text/babel">



const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "doctorName": "Véronique Charland",
  "clinicName": "Clinique du Centre-ville",
  "diagStyle": "actuel",
  "showClinicalTools": false,
  "portalActive": true,
  "startPoints": false,
  "ftBarStyle": "flottant",
  "ftBarPosition": "haut",
  "reviewingMode": false,
  "reviewAuthor": "me",
  "checkoutSuggestions": false,
  "simulateTxFailure": false,
  "templateTextProposed": false,
  "suggestionStyle": "tirets",
  "pendingBadge": true,
  "formOpenMode": "auto",
  "groupRequests": false,
  "inlineFieldEdit": true,
  "aiProposals": false,
  "summaryAddToNote": false,
  "suggestionsColumn": false,
  "themeMode": "clair"
} /*EDITMODE-END*/;

// Filet de sécurité pour toute erreur de rendu non prévue (ex. un composant
// window.XXX manquant si un script a échoué à charger) — sans ça, React
// démonte tout silencieusement et la page reste blanche sans indice.
class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error: error }; }
  componentDidCatch(error, info) { console.error('Erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 99999, background: 'var(--mat-sys-surface-container-lowest)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, fontFamily: 'sans-serif', textAlign: 'center' }}>
          <div style={{ maxWidth: 480 }}>
            <h2 style={{ color: 'light-dark(#b3261e, #e9a9a5)', marginBottom: 8 }}>{t('app.error.title')}</h2>
            <p style={{ color: 'var(--mat-sys-on-surface)', marginBottom: 6 }}>{String(this.state.error && this.state.error.message || this.state.error)}</p>
            <p style={{ color: 'var(--mat-sys-on-surface-variant)', fontSize: 13 }}>{t('app.error.hint')}</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// Libellés (tooltip) + style des pastilles du pied de note — voir le
// `note-footer` dans App, PLAN-checkout-v7.md §M.
const DOC_KIND_LABEL = {
  prescription: t('document.kind.prescription'), clinicalTool: t('document.kind.clinicalTool'),
  lab: t('document.kind.lab'), imaging: t('document.kind.imaging'),
  referral: t('document.kind.referral'), instructions: t('document.kind.instructions'),
};
// Nom accessible d'une pastille : `title` seul n'est ni lu de façon fiable par
// les lecteurs d'écran ni atteignable au clavier — chaque pastille porte donc
// aussi role="img" + aria-label, qui disent ce que compte le chiffre.
function docPillLabel(kind, done, total) {
  return tn('document.pill.aria', done, { kind: DOC_KIND_LABEL[kind] || kind, total: total });
}
// Éléments partageables au patient par le portail : consignes au patient,
// imagerie, laboratoire et références à un spécialiste. Le compteur monte dès
// l'ajout dans la note (pas à la transmission) et, comme les autres pastilles,
// la pastille n'existe pas tant qu'il vaut 0.
const PORTAL_KINDS = ['instructions', 'imaging', 'lab', 'referral'];
function portalSharedCount(summary) {
  return summary.reduce(function (n, s) { return PORTAL_KINDS.indexOf(s.kind) >= 0 ? n + s.total : n; }, 0);
}
function portalPillLabel(shared) {
  return tn('portal.pill.label', shared);
}
// Glyphe des pastilles : police Material Symbols (les noms comme « radiology »
// n'existent pas dans Material Icons Outlined, où le texte s'affichait en
// clair et étirait la pastille à ~130 px) + boîte fixe 17 px qui ne peut plus
// s'élargir si un nom d'icône est inconnu.
const docPillIcon = { fontSize: 17, width: 17, height: 17, overflow: 'hidden', flexShrink: 0, lineHeight: 1 };
function docPillStyle(done) {
  return {
    display: 'flex', alignItems: 'center', gap: 'var(--ds-spacing-xxs)',
    padding: 'var(--ds-spacing-xxs) var(--ds-spacing-12)', borderRadius: 'var(--mat-sys-corner-large)',
    background: done ? 'var(--mat-sys-surface-container-low)' : 'var(--mat-sys-primary-container)',
    color: done ? 'var(--mat-sys-on-surface-variant)' : 'var(--mat-sys-primary)',
    font: 'var(--mat-sys-label-medium)', fontWeight: 600, letterSpacing: 'var(--mat-sys-label-medium-tracking)',
  };
}

function App() {
  const [tUser, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Mode présentation (?presentation, voir presentation-mode.jsx) : réglages
  // figés par-dessus les écarts locaux, et pas de panneau Tweaks.
  const [presenting, setPresenting] = React.useState(isPresentationMode);
  // La bulle du menu latéral bascule le mode à chaud (sans recharger : la note
  // en cours reste). L'URL suit, pour qu'un rechargement garde le mode.
  function togglePresentation() {
    var next = !presenting;
    try {
      var url = new URL(window.location.href);
      if (next) { url.searchParams.set('presentation', ''); url.hash = '#ch=1'; }
      else { url.searchParams.delete('presentation'); url.hash = ''; }
      window.history.replaceState(null, '', url.toString().replace('presentation=', 'presentation'));
    } catch (e) {}
    setPresenting(next);
  }
  const t = presenting ? Object.assign({}, tUser, PRESENTATION_TWEAKS) : tUser;

  // Mode clair / sombre : mêmes classes que le DS (omnimed-light / omnimed-dark
  // sur <html>) — elles posent `color-scheme`, ce qui retourne tous les jetons.
  React.useEffect(function () {
    var root = document.documentElement;
    var dark = t.themeMode === 'sombre';
    root.classList.toggle('omnimed-dark', dark);
    root.classList.toggle('omnimed-light', !dark);
  }, [t.themeMode]);
  const [navCollapsed, setNavCollapsed] = React.useState(function () {
    return window.innerWidth <= 1500;
  });
  // Rail auto : réduit ≤1500px, déployé au-delà — recalculé à chaque
  // redimensionnement (écrase un repli/déploiement manuel au prochain resize,
  // par design : c'est une règle de largeur, pas juste une valeur par défaut).
  React.useEffect(function () {
    function onResize() { setNavCollapsed(window.innerWidth <= 1500); }
    window.addEventListener('resize', onResize);
    return function () { window.removeEventListener('resize', onResize); };
  }, []);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [bannerCollapsed, setBannerCollapsed] = React.useState(false);
  const [smartModal, setSmartModal] = React.useState(false);
  const [smartActive, setSmartActive] = React.useState(false);
  const [completedNotes, setCompletedNotes] = React.useState([]);
  const [docStatusSummary, setDocStatusSummary] = React.useState([]);
  const noteCompleteRef = React.useRef(null);
  const noteSaveDraftRef = React.useRef(null);

  React.useEffect(() => {
    function handler(e) { setDocStatusSummary(e.detail || []); }
    window.addEventListener('note:doc-status-change', handler);
    return () => window.removeEventListener('note:doc-status-change', handler);
  }, []);

  // Notifie l'entrée au dossier quand le portail patient est actif — le
  // toast s'auto-efface après 5s, mais l'indicatif reste visible en continu
  // dans le PatientBanner (contenu temporisé seul = problème d'accessibilité).
  React.useEffect(() => {
    if (t.portalActive) {
      toast(window.t('app.portailPatientActif.toast'), { icon: 'verified_user', duration: 5000 });
    }
  }, [t.portalActive]);

  function handleNoteOpen() {
    if (noteOpen) return;
    setNoteOpen(true);
    setTimeout(() => setBannerCollapsed(true), 260);
  }
  // « Depuis la dernière note » lie les deux notes au même épisode de soin —
  // si la dernière note n'en avait pas encore, on lui en assigne un ici (elle
  // garde son propre timestamp ; seule la liste affiche le lien — NotesList.jsx).
  function handleLinkEpisode(epId) {
    setCompletedNotes(prev => {
      if (!prev.length || prev[0].episodeId) return prev;
      return prev.map((n, i) => i === 0 ? { ...n, episodeId: epId } : n);
    });
  }
  // Complète une note archive un instantané figé (txState) — mais le
  // checkout peut continuer sur ses documents restants (ex. l'ordonnance)
  // après cet instant (voir finalizeNote/frozenDocs dans TransmissionModal) :
  // sans ce rappel, ce travail ultérieur ne serait jamais reflété dans le
  // Journal, qui montrerait pour toujours « non complétée / non transmise ».
  // Sûr de ne cibler que la note qu'on vient d'archiver : le flux de
  // transmission bloque l'interface tant qu'il est ouvert, donc aucune autre
  // note ne peut se glisser devant elle dans la liste entre-temps.
  function patchLastCompletedTx(docId, patch) {
    setCompletedNotes(prev => {
      if (!prev.length) return prev;
      const first = prev[0];
      const nextTxState = { ...first.txState, [docId]: { ...(first.txState && first.txState[docId]), ...patch } };
      return [{ ...first, txState: nextTxState }, ...prev.slice(1)];
    });
  }
  function handleNoteComplete(data) {
    const d = new Date(data.date + 'T' + (data.time || '00:00'));
    const monthName = d.toLocaleDateString(window.I18N.locale, { month: 'long' }).toLocaleUpperCase(window.I18N.locale);
    const dateLabel = d.getDate() + ' ' + monthName + ' ' + d.getFullYear() + ' ' + (data.time || '');
    const newNote = {
      date: dateLabel.trim(),
      author: t.doctorName,
      clinic: t.clinicName,
      role: 'Médecin de famille',
      mode: data.visitType === 'phone' ? L('APPEL') : L('PRÉSENTIEL'),
      title: data.raison || window.t('app.noteClinique.tooltip'),
      icons: [],
      diagnostics: data.diagnostics || [],
      details: '',
      conclusion: '',
      files: [],
      doc: data.doc || window.DEFAULT_DOC(),
      episodeId: data.episodeId || null,
      // Jamais lu par un rendu « autre intervenant » (ex. NotesList pour les
      // notes d'un autre auteur) : seul l'auteur (author, ci-dessus) y a accès.
      confidential: data.confidential || null,
      // Statuts et destinataires de transmission figés à la complétion —
      // relus par le bouton « Checkout » du Journal (NotesList).
      txState: data.txState || {},
      groupRequests: !!data.groupRequests,
    };
    setCompletedNotes(prev => [newNote, ...prev]);
    setNoteOpen(false);
    setSmartActive(false);
    setBannerCollapsed(false);
  }
  return (
    <div className={"app diag-style-" + (t.diagStyle || 'actuel') + (presenting ? ' presentation' : '')}>
      <TopBar user={t.doctorName} clinic={t.clinicName} onMenuClick={() => setNavCollapsed((v) => !v)} />
      <div className="main-row">
        <SideNav collapsed={navCollapsed} presenting={presenting} onTogglePresentation={togglePresentation} />
        <div className="content">
          <div className="center-wrap">
          <PatientBanner forceCollapsed={bannerCollapsed} portalActive={t.portalActive} clinicName={t.clinicName} />
          <div className="center-col" style={{ padding: "0px" }}>
            <NoteEditor
              isOpen={noteOpen}
              onOpen={handleNoteOpen}
              onComplete={handleNoteComplete}
              onPatchArchivedTx={patchLastCompletedTx}
              completeRef={noteCompleteRef}
              doctorName={t.doctorName}
              institution={t.clinicName}
              smartActive={smartActive}
              showClinicalTools={t.showClinicalTools}
              startPoints={t.startPoints}
              lastNote={completedNotes[0] || null}
              onLinkEpisode={handleLinkEpisode}
              onSmartPick={() => setSmartModal(true)}
              saveDraftRef={noteSaveDraftRef}
              ftBarStyle={t.ftBarStyle || 'haut'}
              ftBarPosition={t.ftBarPosition || 'haut'}
              reviewingMode={t.reviewingMode === true}
              reviewAuthor={t.reviewAuthor || 'me'}
              checkoutSuggestions={t.checkoutSuggestions === true}
              simulateTxFailure={t.simulateTxFailure === true}
              templateTextProposed={t.templateTextProposed === true}
              suggestionStyle={t.suggestionStyle || 'tirets'}
              formOpenMode={t.formOpenMode || 'auto'}
              groupRequests={t.groupRequests === true}
              inlineFieldEdit={t.inlineFieldEdit !== false}
              pendingBadge={t.pendingBadge !== false}
              aiProposals={t.aiProposals === true}
              suggestionsColumn={t.suggestionsColumn === true} />
            <NotesList doctorName={t.doctorName} clinicName={t.clinicName} extraNotes={completedNotes} />
            {noteOpen &&
            <div className="note-footer" style={{ gap: "8px", borderRadius: "16px 16px 16px 1px", padding: "16px" }}>
              {/* Pastilles complété/total par nature de document transmissible
                  (voir PLAN-checkout-v7.md §M) — remplace les anciens compteurs
                  bruts par type de chip. Grisées une fois done === total. */}
              {docStatusSummary.map((s) => {
                const done = s.total > 0 && s.done === s.total;
                return (
                  <div key={s.kind} role="img" aria-label={docPillLabel(s.kind, s.done, s.total)} title={docPillLabel(s.kind, s.done, s.total)} style={docPillStyle(done)}>
                    <span className="material-symbols-outlined" aria-hidden="true" style={docPillIcon}>{s.icon}</span>
                    {s.done}/{s.total}
                  </div>
                );
              })}
              {/* Portail patient : nombre d'éléments partageables présents dans
                  la note (consignes, imagerie, laboratoire, références —
                  PORTAL_KINDS). Cachée à 0 comme les autres pastilles, et quand
                  le patient n'a pas le portail. Pas de pastille pré-facturation
                  tant qu'aucune donnée de facturation n'existe (PLAN §M.2/M.3). */}
              {t.portalActive !== false && portalSharedCount(docStatusSummary) > 0 &&
              <div role="img" aria-label={portalPillLabel(portalSharedCount(docStatusSummary))} title={portalPillLabel(portalSharedCount(docStatusSummary))} style={docPillStyle(true)}>
                <span className="material-symbols-outlined" aria-hidden="true" style={docPillIcon}>verified_user</span>
                {portalSharedCount(docStatusSummary)}
              </div>}
              <div style={{ flex: 1 }} />
              <button className="ds-btn ds-btn--tonal"
                onClick={() => { if (noteSaveDraftRef.current) noteSaveDraftRef.current(); }}>{window.t('app.sauvegarder.button')}</button>
              <button className="ds-btn ds-btn--filled"
                onClick={() => { if (noteCompleteRef.current) noteCompleteRef.current(); }}>{window.t('app.finaliser.button')}</button>
            </div>
            }
          </div>
          </div>
          <Summary addToNote={t.summaryAddToNote === true} />
        </div>
      </div>

      {(t.ftBarStyle || 'haut') === 'flottant' && <FloatingToolbar position={t.ftBarPosition || 'haut'} />}
      <ToastHost />
      {smartModal &&
        <SmartNoteModal
          onCancel={() => setSmartModal(false)}
          onConfirm={() => { setSmartModal(false); setSmartActive(true); handleNoteOpen(); }} />
      }
      {presenting && <PresentationMode noteOpen={noteOpen} onOpenNote={handleNoteOpen} />}
      {!presenting &&
      <TweaksPanel title="Tweaks">
        <TweakSection label="Identité" />
        <TweakText label="Nom de l'utilisateur" value={t.doctorName} onChange={(v) => setTweak("doctorName", v)} />
        <TweakText label="Nom de la clinique" value={t.clinicName} onChange={(v) => setTweak("clinicName", v)} />
        <TweakSection label="Général" />
        {/* Langue : la page se recharge dans l'autre langue (voir i18n.js, urlFor) ;
            les réglages ci-dessus survivent au rechargement. Les noms des langues
            ne se traduisent jamais. */}
        <TweakRadio label="Langue"
                    value={window.I18N.lang}
                    options={[
                      { value: 'fr', label: 'Français' },
                      { value: 'en', label: 'English' },
                    ]}
                    onChange={(v) => { if (v !== window.I18N.lang) window.location.assign(window.I18N.urlFor(v, window.location.href)); }} />
        <TweakRadio label="Mode"
                    value={t.themeMode || 'clair'}
                    options={[
                      { value: 'clair', label: 'Clair' },
                      { value: 'sombre', label: 'Sombre' },
                    ]}
                    onChange={(v) => setTweak('themeMode', v)} />
        <TweakToggle label="Outils cliniques" value={t.showClinicalTools !== false}
                     onChange={(v) => setTweak('showClinicalTools', v)} />
        <TweakToggle label="Portail patient actif" value={t.portalActive !== false}
                     onChange={(v) => setTweak('portalActive', v)} />
        <TweakToggle label="Points de départ" value={t.startPoints === true}
                     onChange={(v) => setTweak('startPoints', v)} />
        <TweakRadio label="Barre de mise en forme"
                    value={t.ftBarStyle || 'haut'}
                    options={[
                      { value: 'haut', label: 'Haut de note' },
                      { value: 'flottant', label: 'Flottante' },
                    ]}
                    onChange={(v) => setTweak('ftBarStyle', v)} />
        {/* "Haut de note" : bas = après le corps de la note (avant les outils
            cliniques) plutôt qu'avant. "Flottante" : bas = sous la sélection
            plutôt qu'au-dessus. */}
        <TweakRadio label="Position de la barre"
                    value={t.ftBarPosition || 'haut'}
                    options={[
                      { value: 'haut', label: 'Haut' },
                      { value: 'bas', label: 'Bas' },
                    ]}
                    onChange={(v) => setTweak('ftBarPosition', v)} />
        <TweakSection label="Checkout" />
        <TweakToggle label="Suggestions de destinataires (✨)" value={t.checkoutSuggestions === true}
                     onChange={(v) => setTweak('checkoutSuggestions', v)} />
        <TweakRadio label="Checkout des requêtes"
                    value={t.groupRequests === true ? 'type' : 'puce'}
                    options={[
                      { value: 'puce', label: 'Une par puce' },
                      { value: 'type', label: 'Regroupées' },
                    ]}
                    onChange={(v) => setTweak('groupRequests', v === 'type')} />
        <TweakToggle label="Simuler un échec de transmission" value={t.simulateTxFailure === true}
                     onChange={(v) => setTweak('simulateTxFailure', v)} />
        <TweakSection label="Gabarits" />
        <TweakToggle label="Gabarit : texte proposé" value={t.templateTextProposed === true}
                     onChange={(v) => setTweak('templateTextProposed', v)} />
        <TweakRadio label="Style des suggestions"
                    value={t.suggestionStyle || 'tirets'}
                    options={[
                      { value: 'tirets', label: 'Tirets' },
                      { value: 'opacite', label: 'Estompé' },
                      { value: 'violet', label: 'Mauve' },
                    ]}
                    onChange={(v) => setTweak('suggestionStyle', v)} />
        <TweakToggle label="Badge « En suspens » sur les suggestions" value={t.pendingBadge !== false}
                     onChange={(v) => setTweak('pendingBadge', v)} />
        <TweakSection label="Pistes (vision)" />
        <TweakToggle label="Colonne de suggestions" value={t.suggestionsColumn === true}
                     onChange={(v) => setTweak('suggestionsColumn', v)} />
        <TweakToggle label="IA : éléments structurés proposés" value={t.aiProposals === true}
                     onChange={(v) => setTweak('aiProposals', v)} />
        <TweakToggle label="Le « + » du sommaire ajoute dans la note" value={t.summaryAddToNote === true}
                     onChange={(v) => setTweak('summaryAddToNote', v)} />
        <TweakSection label="Formulaire d'une puce" />
        <TweakToggle label="Édition inline des valeurs secondaires (après Q1 2027)" value={t.inlineFieldEdit !== false}
                     onChange={(v) => setTweak('inlineFieldEdit', v)} />
        <TweakSelect label="Ouverture du formulaire"
                     value={t.formOpenMode || 'auto'}
                     options={[
                       { value: 'auto', label: 'Auto (sous, au-dessus, sinon centré)' },
                       { value: 'sous', label: 'Sous la puce (corps qui défile)' },
                       { value: 'centre', label: 'Centré' },
                       { value: 'sheet', label: 'Bottom sheet' },
                     ]}
                     onChange={(v) => setTweak('formOpenMode', v)} />
        <TweakSection label="Mode révision" />
        <TweakToggle label="Mode révision (flag)" value={t.reviewingMode === true}
                     onChange={(v) => setTweak('reviewingMode', v)} />
        <TweakSelect label="Écrire en tant que…"
                    value={t.reviewAuthor || 'me'}
                    options={(window.reviewHumanAuthors ? window.reviewHumanAuthors(t.doctorName) : []).map((a) => ({ value: a.id, label: a.name }))}
                    onChange={(v) => setTweak('reviewAuthor', v)} />
        <TweakSection label="Diagnostics" />
        <TweakRadio label="Style de région"
                    value={t.diagStyle || 'actuel'}
                    options={[
                      { value: 'numbered', label: 'Numéroté' },
                      { value: 'actuel', label: 'Actuel' },
                      { value: 'carte', label: 'Carte' },
                      { value: 'etiquette', label: 'Étiquette' },
                    ]}
                    onChange={(v) => setTweak('diagStyle', v)} />
      </TweaksPanel>}
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>

</body>
</html>
