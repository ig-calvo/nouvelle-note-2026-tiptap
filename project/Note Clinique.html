    flex: 1;

    flex-direction: row;
    gap: 16px;
    min-width: 0;
    overflow: hidden;
    background: #f4f5f7;
    align-items: stretch;
  }
  /* Colonne centrale : bannière patient épinglée + zone défilante.
     La bannière vit HORS du conteneur scrollable pour éviter le bug de
     compositing (sticky + z-index dans overflow:auto passe au-dessus des
     scrims fixes). Hors-scroll, un z-index normal suffit : au-dessus du
     contenu, sous les scrims. */
  .center-wrap {
    flex: 1;
    min-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    padding-right: 8px;

  /* Note expansion animation */
  @keyframes ftbar-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

    0%, 100% { opacity: 1; } 50% { opacity: 0.25; }
  }
  @keyframes ai-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes note-expand {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .note-expand {
    animation: note-expand 300ms ease-in-out;
  }
  /* Patient banner collapse animation */
  @keyframes banner-collapse-in {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .banner-collapse {
    animation: banner-collapse-in 300ms ease-in-out;
  }
  .note-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: #fff;
    border-top: 1px solid #e5e5ec;
    /* Pas de z-index : sticky crée déjà son propre contexte d'empilement et,
       étant le dernier enfant, il couvre le contenu qui défile dessous. Un
       z-index positif le ferait passer au-dessus des scrims modaux (piégés
       dans l'aside Summary en position:sticky). */
    min-height: 64px;
    margin-top: auto;
    box-shadow: 0 -4px 12px rgba(37,36,94,0.08);

  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes docviewer-in { from { transform: translateX(100%); } to { transform: translateX(0); } }

<!-- Tiptap (exploration — remplace Quill). Import dynamique (au lieu d'un
     `import` statique) pour pouvoir intercepter un échec réseau — un CDN
     injoignable (esm.sh) faisait autrement planter silencieusement tout le
     reste du chargement (page blanche, sans message). Version épinglée sur
     tous les paquets @tiptap/* pour éviter une double instance de
     prosemirror-model. -->
<script type="module">
  (async function () {
    try {
      const [core, pmState, starterKit, placeholder, suggestion, underline, textStyle, color, highlight, link] = await Promise.all([
        import('https://esm.sh/@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/pm@2.11.5/state'),
        import('https://esm.sh/@tiptap/starter-kit@2.11.5'),
        import('https://esm.sh/@tiptap/extension-placeholder@2.11.5'),
        import('https://esm.sh/@tiptap/suggestion@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/pm@2.11.5'),
        import('https://esm.sh/@tiptap/extension-underline@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-text-style@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-color@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/extension-text-style@2.11.5'),
        import('https://esm.sh/@tiptap/extension-highlight@2.11.5?deps=@tiptap/core@2.11.5'),
        import('https://esm.sh/@tiptap/extension-link@2.11.5?deps=@tiptap/core@2.11.5,@tiptap/pm@2.11.5'),
      ]);
      window.Tiptap = {
        Editor: core.Editor, Node: core.Node, Mark: core.Mark, Extension: core.Extension, mergeAttributes: core.mergeAttributes,
        StarterKit: starterKit.default, Placeholder: placeholder.default, Suggestion: suggestion.default,
        Underline: underline.default, TextStyle: textStyle.default, Color: color.default, Highlight: highlight.default,
        Link: link.default,
        pm: { Plugin: pmState.Plugin, PluginKey: pmState.PluginKey, TextSelection: pmState.TextSelection }
      };
      window.dispatchEvent(new Event('tiptap:ready'));
    } catch (err) {
      window.dispatchEvent(new CustomEvent('tiptap:error', { detail: { message: (err && err.message) || String(err) } }));
    }
  })();
</script>

<!-- Chargeur JSX avec anti-cache : ajoute un horodatage à chaque rechargement
     pour qu'on voie toujours la dernière version du code pendant le prototypage.
     TOUJOURS synchrone et inconditionnel : document.write() appelé après la
     fin du parsing (ex. depuis un callback asynchrone comme un event listener
     ou une Promise résolue) déclenche un document.open() implicite qui EFFACE
     toute la page (dont #root) — une version antérieure attendait l'événement
     tiptap:ready avant d'appeler document.write ici, ce qui cassait le
     chargement de façon intermittente. Ne plus reproduire ce piège : ce
     chargeur doit rester un bloc <script> classique exécuté pendant le
     parsing initial, sans dépendance asynchrone. -->
<script>
(function () {
  var srcs = [
    'tweaks-panel.jsx',
    'note-ui/Toast.jsx',
    'note-ui/TopBar.jsx',
    'note-ui/SideNav.jsx',
    'note-ui/PatientBanner.jsx',
    'note-ui/editor-data.jsx',
    'note-ui/editor-popover.jsx',
    'note-ui/editor-schema.jsx',
    'note-ui/review-mode.jsx',
    'note-ui/DocumentViewerModal.jsx',
    'note-ui/editor-field.jsx',
    'note-ui/AIBox.jsx',
    'note-ui/ClinicalTool.jsx',
    'note-ui/ClinicalToolPicker.jsx',
    'note-ui/DocumentPreview.jsx',
    'note-ui/PrintDialog.jsx',
    'note-ui/FaxScreen.jsx',
    'note-ui/DocumentActionPanel.jsx',
    'note-ui/TransmissionModal.jsx',
    'note-ui/QuickSendModal.jsx',
    'note-ui/rich-text-controls.jsx',
    'note-ui/NoteEditor.jsx',
    'note-ui/NoteStartCards.jsx',
    'note-ui/SmartNoteModal.jsx',
    'note-ui/NotesList.jsx',
    'note-ui/FloatingToolbar.jsx',
    'note-ui/SummaryModals.jsx',
    'note-ui/Summary.jsx'
  ];
  var bust = '?v=' + Date.now();
  for (var i = 0; i < srcs.length; i++) {
    document.write('<script type="text/babel" src="' + srcs[i] + bust + '"><\/script>');
  }
})();
</script>
<!-- Message diagnostic si Tiptap échoue à charger (CDN injoignable/bloqué) —
     posé via les API DOM normales (createElement/appendChild), jamais
     document.write, justement pour rester sans risque même déclenché de
     façon asynchrone par l'événement tiptap:error ci-dessus. -->
<script>
(function () {
  function showBanner(message) {
    var div = document.createElement('div');
    div.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;padding:32px;font-family:sans-serif;text-align:center;';
    div.innerHTML =
      '<div style="max-width:480px;"><h2 style="color:#b3261e;margin-bottom:8px;">Le prototype n’a pas pu charger Tiptap</h2>' +
      '<p style="color:#444;margin-bottom:6px;">' + String(message).replace(/</g, '&lt;') + '</p>' +
      '<p style="color:#777;font-size:13px;">Vérifiez votre connexion internet (esm.sh) et rechargez la page.</p></div>';
    (document.body || document.documentElement).appendChild(div);
  }
  window.addEventListener('tiptap:error', function (e) {
    showBanner((e.detail && e.detail.message) || 'Erreur de chargement de Tiptap.');
  });
})();
</script>

<script type="text/babel">



const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "doctorName": "Véronique Charland",
  "clinicName": "Clinique du Centre-ville",
  "diagStyle": "actuel",
  "showClinicalTools": true,
  "portalActive": true,
  "startPoints": false,
  "ftBarStyle": "flottant",
  "ftBarPosition": "haut",
  "reviewingMode": false,
  "reviewAuthor": "me",
  "checkoutSuggestions": false
} /*EDITMODE-END*/;

// Filet de sécurité pour toute erreur de rendu non prévue (ex. un composant
// window.XXX manquant si un script a échoué à charger) — sans ça, React
// démonte tout silencieusement et la page reste blanche sans indice.
class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error: error }; }
  componentDidCatch(error, info) { console.error('Erreur de rendu :', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 99999, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, fontFamily: 'sans-serif', textAlign: 'center' }}>
          <div style={{ maxWidth: 480 }}>
            <h2 style={{ color: '#b3261e', marginBottom: 8 }}>Le prototype a rencontré une erreur</h2>
            <p style={{ color: '#444', marginBottom: 6 }}>{String(this.state.error && this.state.error.message || this.state.error)}</p>
            <p style={{ color: '#777', fontSize: 13 }}>Rechargez la page. Si le problème persiste, ouvrez la console (F12) et signalez le message ci-dessus.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [navCollapsed, setNavCollapsed] = React.useState(function () {
    return window.innerWidth <= 1500;
  });
  // Rail auto : réduit ≤1500px, déployé au-delà — recalculé à chaque
  // redimensionnement (écrase un repli/déploiement manuel au prochain resize,
  // par design : c'est une règle de largeur, pas juste une valeur par défaut).
  React.useEffect(function () {
    function onResize() { setNavCollapsed(window.innerWidth <= 1500); }
    window.addEventListener('resize', onResize);
    return function () { window.removeEventListener('resize', onResize); };
  }, []);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [bannerCollapsed, setBannerCollapsed] = React.useState(false);
  const [smartModal, setSmartModal] = React.useState(false);
  const [smartActive, setSmartActive] = React.useState(false);
  const [completedNotes, setCompletedNotes] = React.useState([]);
  const [chipCounts, setChipCounts] = React.useState({});
  const noteCompleteRef = React.useRef(null);
  const noteSaveDraftRef = React.useRef(null);
  const noteTransmitRef = React.useRef(null);

  React.useEffect(() => {
    function handler(e) { setChipCounts(e.detail || {}); }
    window.addEventListener('note:chips-change', handler);
    return () => window.removeEventListener('note:chips-change', handler);
  }, []);

  // Notifie l'entrée au dossier quand le portail patient est actif — le
  // toast s'auto-efface après 5s, mais l'indicatif reste visible en continu
  // dans le PatientBanner (contenu temporisé seul = problème d'accessibilité).
  React.useEffect(() => {
    if (t.portalActive) {
      toast('Portail patient actif', { icon: 'verified_user', duration: 5000 });
    }
  }, [t.portalActive]);

  function handleNoteOpen() {
    if (noteOpen) return;
    setNoteOpen(true);
    setTimeout(() => setBannerCollapsed(true), 260);
  }
  // « Depuis la dernière note » lie les deux notes au même épisode de soin —
  // si la dernière note n'en avait pas encore, on lui en assigne un ici (elle
  // garde son propre timestamp ; seule la liste affiche le lien — NotesList.jsx).
  function handleLinkEpisode(epId) {
    setCompletedNotes(prev => {
      if (!prev.length || prev[0].episodeId) return prev;
      return prev.map((n, i) => i === 0 ? { ...n, episodeId: epId } : n);
    });
  }
  function handleNoteComplete(data) {
    const months = ['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
    const d = new Date(data.date + 'T' + (data.time || '00:00'));
    const dateLabel = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' ' + (data.time || '');
    const newNote = {
      date: dateLabel.trim(),
      author: t.doctorName,
      clinic: t.clinicName,
      role: 'Médecin de famille',
      mode: data.visitType === 'Appel téléphonique' ? 'APPEL' : 'PRÉSENTIEL',
      title: data.raison || 'Note clinique',
      icons: [],
      diagnostics: data.diagnostics || [],
      details: '',
      conclusion: '',
      files: [],
      doc: data.doc || window.DEFAULT_DOC(),
      episodeId: data.episodeId || null,
      // Statuts et destinataires de transmission figés à la complétion —
      // relus par le bouton « Checkout » du Journal (NotesList).
      txState: data.txState || {},
    };
    setCompletedNotes(prev => [newNote, ...prev]);
    setNoteOpen(false);
    setSmartActive(false);
    setBannerCollapsed(false);
  }
  return (
    <div className={"app diag-style-" + (t.diagStyle || 'actuel')}>
      <TopBar user={t.doctorName} clinic={t.clinicName} onMenuClick={() => setNavCollapsed((v) => !v)} />
      <div className="main-row">
        <SideNav collapsed={navCollapsed} />
        <div className="content">
          <div className="center-wrap">
          <PatientBanner forceCollapsed={bannerCollapsed} portalActive={t.portalActive} clinicName={t.clinicName} />
          <div className="center-col" style={{ padding: "0px" }}>
            <NoteEditor
              isOpen={noteOpen}
              onOpen={handleNoteOpen}
              onComplete={handleNoteComplete}
              completeRef={noteCompleteRef}
              doctorName={t.doctorName}
              institution={t.clinicName}
              smartActive={smartActive}
              showClinicalTools={t.showClinicalTools}
              startPoints={t.startPoints}
              lastNote={completedNotes[0] || null}
              onLinkEpisode={handleLinkEpisode}
              onSmartPick={() => setSmartModal(true)}
              saveDraftRef={noteSaveDraftRef}
              transmitRef={noteTransmitRef}
              ftBarStyle={t.ftBarStyle || 'haut'}
              ftBarPosition={t.ftBarPosition || 'haut'}
              reviewingMode={t.reviewingMode === true}
              reviewAuthor={t.reviewAuthor || 'me'}
              checkoutSuggestions={t.checkoutSuggestions === true} />
            <NotesList doctorName={t.doctorName} clinicName={t.clinicName} extraNotes={completedNotes} />
            {noteOpen &&
            <div className="note-footer" style={{ gap: "8px", borderRadius: "16px 16px 16px 1px", padding: "16px" }}>
              {/* Prescription counter */}
              {(chipCounts.prescription > 0) && (
                <div title="Prescriptions" style={{ position: 'relative', marginLeft: 4, display: 'flex', alignItems: 'center' }}>
                  <button style={{ background: 'none', border: 0, cursor: 'default', fontFamily: "'Poppins',sans-serif", fontWeight: 700, fontSize: 16, color: '#25245E', padding: '4px 2px', letterSpacing: -0.5 }}>Rᴘ</button>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.prescription}</span>
                </div>
              )}
              {/* Lab counter */}
              {(chipCounts.lab > 0) && (
                <div title="Laboratoire" style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: 4 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 22, color: '#25245E' }}>science</span>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.lab}</span>
                </div>
              )}
              {/* Imaging counter */}
              {(chipCounts.imaging > 0) && (
                <div title="Imagerie" style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: 4 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 22, color: '#25245E' }}>radiology</span>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.imaging}</span>
                </div>
              )}
              {/* Referral counter */}
              {(chipCounts.referral > 0) && (
                <div title="Références" style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: 4 }}>
                  <span className="material-symbols-outlined" style={{ fontSize: 22, color: '#25245E' }}>person_add</span>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.referral}</span>
                </div>
              )}
              {/* Diagnostic counter */}
              {(chipCounts.diagnostic > 0) && (
                <div title="Diagnostics" style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: 4 }}>
                  <span className="material-icons-outlined" style={{ fontSize: 22, color: '#25245E' }}>local_hospital</span>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.diagnostic}</span>
                </div>
              )}
              {/* File counter */}
              {(chipCounts.file > 0) && (
                <div title="Fichiers" style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: 4 }}>
                  <span className="material-icons-outlined" style={{ fontSize: 22, color: '#25245E' }}>attach_file</span>
                  <span style={{ position: 'absolute', top: -2, right: -10, minWidth: 18, height: 18, background: '#1975d1', borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: '#fff', fontWeight: 700, padding: '0 3px' }}>{chipCounts.file}</span>
                </div>
              )}
              <div style={{ flex: 1 }} />
              <button style={{ border: '1px solid #d0d0e0', borderRadius: 8, background: '#eeeef8', padding: '9px 22px', cursor: 'pointer', font: "500 14px 'Inter',sans-serif", color: '#25245E' }}
                onClick={() => { if (noteSaveDraftRef.current) noteSaveDraftRef.current(); }}>Sauvegarder</button>
              <button style={{ border: 0, borderRadius: 8, background: '#25245E', padding: '9px 24px', cursor: 'pointer', font: "600 14px 'Inter',sans-serif", color: '#fff' }}
                onClick={() => { if (noteCompleteRef.current) noteCompleteRef.current(); }}>Compléter</button>
              <button title="Transmission des documents" style={{ border: '1px solid #d0d0e0', borderRadius: 8, background: '#fff', width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#25245E' }}
                onClick={() => { if (noteTransmitRef.current) noteTransmitRef.current(); }}>
                <span className="material-icons-outlined" style={{ fontSize: 20 }}>send</span>
              </button>
            </div>
            }
          </div>
          </div>
          <Summary />
        </div>
      </div>

      {(t.ftBarStyle || 'haut') === 'flottant' && <FloatingToolbar position={t.ftBarPosition || 'haut'} />}
      <ToastHost />
      {smartModal &&
        <SmartNoteModal
          onCancel={() => setSmartModal(false)}
          onConfirm={() => { setSmartModal(false); setSmartActive(true); handleNoteOpen(); }} />
      }
      <TweaksPanel title="Tweaks">
        <TweakSection label="Identité" />
        <TweakText label="Nom de l'utilisateur" value={t.doctorName} onChange={(v) => setTweak("doctorName", v)} />
        <TweakText label="Nom de la clinique" value={t.clinicName} onChange={(v) => setTweak("clinicName", v)} />
        <TweakSection label="Général" />
        <TweakToggle label="Outils cliniques" value={t.showClinicalTools !== false}
                     onChange={(v) => setTweak('showClinicalTools', v)} />
        <TweakToggle label="Portail patient actif" value={t.portalActive !== false}
                     onChange={(v) => setTweak('portalActive', v)} />
        <TweakToggle label="Points de départ" value={t.startPoints === true}
                     onChange={(v) => setTweak('startPoints', v)} />
        <TweakRadio label="Barre de mise en forme"
                    value={t.ftBarStyle || 'haut'}
                    options={[
                      { value: 'haut', label: 'Haut de note' },
                      { value: 'flottant', label: 'Flottante' },
                    ]}
                    onChange={(v) => setTweak('ftBarStyle', v)} />
        {/* "Haut de note" : bas = après le corps de la note (avant les outils
            cliniques) plutôt qu'avant. "Flottante" : bas = sous la sélection
            plutôt qu'au-dessus. */}
        <TweakRadio label="Position de la barre"
                    value={t.ftBarPosition || 'haut'}
                    options={[
                      { value: 'haut', label: 'Haut' },
                      { value: 'bas', label: 'Bas' },
                    ]}
                    onChange={(v) => setTweak('ftBarPosition', v)} />
        <TweakSection label="Checkout" />
        <TweakToggle label="Suggestions (✨)" value={t.checkoutSuggestions === true}
                     onChange={(v) => setTweak('checkoutSuggestions', v)} />
        <TweakSection label="Mode révision" />
        <TweakToggle label="Mode révision (flag)" value={t.reviewingMode === true}
                     onChange={(v) => setTweak('reviewingMode', v)} />
        <TweakSelect label="Écrire en tant que…"
                    value={t.reviewAuthor || 'me'}
                    options={(window.reviewHumanAuthors ? window.reviewHumanAuthors(t.doctorName) : []).map((a) => ({ value: a.id, label: a.name }))}
                    onChange={(v) => setTweak('reviewAuthor', v)} />
        <TweakSection label="Diagnostics" />
        <TweakRadio label="Style de région"
                    value={t.diagStyle || 'actuel'}
                    options={[
                      { value: 'numbered', label: 'Numéroté' },
                      { value: 'actuel', label: 'Actuel' },
                      { value: 'carte', label: 'Carte' },
                      { value: 'etiquette', label: 'Étiquette' },
                      { value: 'rail', label: 'Rail' },
                    ]}
                    onChange={(v) => setTweak('diagStyle', v)} />
      </TweaksPanel>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>

</body>
</html>
